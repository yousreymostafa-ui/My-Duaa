<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أدعيتي V2</title><style>
:root{--bg:#f6f1e9;--bg2:#f3f5f0;--card:#fffdfa;--text:#182522;--muted:#918b81;--line:#e9e2d8;--accent:#1f6e64;--gold:#aa8d58}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg),var(--bg2));min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 7px 24px}.head{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 5px}.brand h1{margin:0;font-size:38px}.brand small{color:var(--muted)}.tools{display:flex;gap:7px}.icon{width:48px;height:48px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--text)}.hero{height:64px;margin:2px 4px 8px;border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent);position:relative;overflow:hidden}.hero:after{content:'☾  ۞  ﷲ';position:absolute;inset:12px 20px;color:var(--gold);opacity:.28;font-size:28px;letter-spacing:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:15px 14px 10px;box-shadow:0 10px 26px rgba(60,55,45,.07);min-width:0}.card.square{grid-column:span 1;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.title{font-size:13px;color:var(--gold);font-weight:800;margin-bottom:7px}.dua{margin:0;white-space:pre-wrap;font-size:21px;line-height:1.65}.square .dua{font-size:15px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden}.actions{display:flex;direction:ltr;align-items:center;gap:11px;margin-top:8px;color:var(--muted)}.act{border:0;background:transparent;color:inherit;padding:0;font-size:24px}.sep{height:20px;width:1px;background:var(--line)}.add{width:100%;height:62px;margin-top:12px;border:0;border-radius:23px;background:var(--accent);color:#fff;font-size:18px;font-weight:800}.overlay{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:20}.overlay.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top h2{margin:0;font-size:20px}.close{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#0000;color:var(--text)}.field,.edit{width:100%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,var(--bg));border-radius:14px;color:var(--text);outline:none}.field{height:45px;padding:0 12px;margin-bottom:8px}.edit{min-height:180px;padding:14px;resize:vertical;line-height:1.7}.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}.seg button,.mini{height:39px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--card) 88%,var(--bg));color:var(--text)}.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}.save{display:flex;gap:8px}.save button{flex:1;height:46px;border-radius:14px;font-weight:800}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:transparent;color:var(--text)}.manage{display:grid;gap:7px}.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--card) 88%,var(--bg))}.row b{font-size:13px}.row small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.move{display:grid;grid-template-columns:repeat(3,31px);gap:3px}.move button{width:31px;height:31px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text)}.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.theme{height:88px;border-radius:15px;border:2px solid transparent;padding:8px;text-align:right;display:flex;flex-direction:column;justify-content:space-between}.theme.on{border-color:var(--accent)}.theme span{font-size:11px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:30px;display:none}.toast.show{display:block}@media(max-width:420px){.brand h1{font-size:34px}.card{border-radius:22px}}
</style></head><body><main class="app"><header class="head"><div class="brand"><h1>أدعيتي</h1><small id="count"></small></div><div class="tools"><button class="icon" id="manage">↕</button><button class="icon" id="themes">◫</button></div></header><div class="hero"></div><section class="grid" id="list"></section><button class="add" id="add">إضافة دعاء ＋</button></main>
<div class="overlay" id="editO"><section class="sheet"><div class="top"><h2 id="editT">إضافة دعاء</h2><button class="close" data-close="editO">×</button></div><input class="field" id="title" placeholder="عنوان اختياري"><textarea class="edit" id="text" placeholder="اكتب الدعاء..."></textarea><div class="seg" id="shape"><button data-v="full">بطاقة كاملة</button><button data-v="square">مربعة ½</button></div><div class="save"><button class="primary" id="save">حفظ</button><button class="secondary" data-close="editO">إلغاء</button></div></section></div>
<div class="overlay" id="manageO"><section class="sheet"><div class="top"><div><h2>إعادة الترتيب</h2><small style="color:var(--muted)">تحكم كامل في ترتيب وشكل كل بطاقة</small></div><button class="close" data-close="manageO">×</button></div><div class="manage" id="manageList"></div></section></div>
<div class="overlay" id="themeO"><section class="sheet"><div class="top"><h2>تصاميم الواجهة</h2><button class="close" data-close="themeO">×</button></div><div class="themes" id="themeList"></div></section></div><div class="toast" id="toast">تم</div>
<script>
const K='my_duaa_items_v1',SK='my_duaa_v2_theme';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const seed=[{id:1,title:'دعاء الشرح',text:'رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي',shape:'full'},{id:2,title:'',text:'حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ',shape:'full'},{id:3,title:'',text:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',shape:'square'},{id:4,title:'',text:'اللهم اغفر لي وارحمني واهدني وعافني وارزقني',shape:'square'}];let d=load(K,seed).map((x,i)=>({...x,id:x.id||Date.now()+i,shape:x.shape==='square'?'square':'full'})),editId=null,shape='full',theme=load(SK,'classic');const ts={classic:['#f6f1e9','#f3f5f0','#fffdfa','#182522','#1f6e64','#aa8d58','Classic'],minimal:['#f4f4f2','#ecefeb','#fff','#202621','#5f7069','#8d9893','Minimal'],green:['#edf3ea','#dfece3','#f8fbf7','#203228','#477f62','#75976e','Green Serenity'],night:['#07141b','#0d2731','#0f2028','#f4f0e7','#49a99f','#c5a66a','Night'],sand:['#f4e6d2','#ead6bc','#fff7eb','#3c2d21','#9b6d42','#bd8e52','Sandstone'],blue:['#eef6fb','#dfeaf2','#f9fcff','#193342','#4b84a6','#7ba0b5','Blue Calm'],floral:['#fff2f0','#f7e5e7','#fffaf8','#3b2b2b','#a76e79','#c58c87','Floral'],gold:['#090a09','#16130e','#12120f','#f5eddc','#af8c50','#c6a66b','Dark Gold'],sunset:['#f6d7ca','#caa0b2','#fff2ea','#432b32','#9d6679','#bc7f69','Sunset']};function load(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}function save(){localStorage.setItem(K,JSON.stringify(d))}function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function applyTheme(){let t=ts[theme]||ts.classic;['--bg','--bg2','--card','--text','--accent','--gold'].forEach((v,i)=>document.documentElement.style.setProperty(v,t[i]));localStorage.setItem(SK,JSON.stringify(theme));renderThemes()}function render(){count.textContent=d.length+' أدعية';list.innerHTML=d.map(x=>`<article class="card ${x.shape==='square'?'square':''}" data-id="${x.id}">${x.title?`<div class="title">${esc(x.title)}</div>`:''}<p class="dua">${esc(x.text)}</p><div class="actions"><button class="act" data-a="menu">…</button><span class="sep"></span><button class="act" data-a="copy">▣</button></div></article>`).join('');$$('.card').forEach(c=>c.onclick=async e=>{let a=e.target.dataset.a;if(!a)return;let x=d.find(z=>String(z.id)===c.dataset.id);if(a==='copy'){try{await navigator.clipboard.writeText(x.text)}catch{}msg('تم النسخ')}else openEdit(x.id)})}function openEdit(id=null){editId=id;let x=d.find(z=>z.id===id);editT.textContent=x?'تعديل الدعاء':'إضافة دعاء';title.value=x?.title||'';text.value=x?.text||'';shape=x?.shape||'full';syncShape();editO.classList.add('show')}function syncShape(){$$('#shape button').forEach(b=>b.classList.toggle('on',b.dataset.v===shape))}function saveEdit(){let v=text.value.trim();if(!v)return;if(editId){let x=d.find(z=>z.id===editId);x.title=title.value.trim();x.text=v;x.shape=shape}else d.push({id:Date.now(),title:title.value.trim(),text:v,shape});save();editO.classList.remove('show');render();renderManage()}function mv(id,dir){let i=d.findIndex(x=>x.id===id),j=Math.max(0,Math.min(d.length-1,i+dir));if(i===j)return;let[x]=d.splice(i,1);d.splice(j,0,x);save();render();renderManage()}function edge(id,end){let i=d.findIndex(x=>x.id===id),[x]=d.splice(i,1);d.splice(end?d.length:0,0,x);save();render();renderManage()}function toggle(id){let x=d.find(z=>z.id===id);x.shape=x.shape==='square'?'full':'square';save();render();renderManage()}function renderManage(){manageList.innerHTML=d.map((x,i)=>`<div class="row"><div style="color:var(--muted)">⠿</div><div><b>${esc(x.title||'دعاء '+(i+1))}</b><small>${esc(x.text)}</small></div><div class="move"><button data-i="${x.id}" data-m="top">⇈</button><button data-i="${x.id}" data-m="up">↑</button><button data-i="${x.id}" data-m="shape">▦</button><button data-i="${x.id}" data-m="down">↓</button><button data-i="${x.id}" data-m="bottom">⇊</button><button data-i="${x.id}" data-m="edit">✎</button></div></div>`).join('');$$('[data-m]').forEach(b=>b.onclick=()=>{let id=+b.dataset.i,m=b.dataset.m;if(m==='top')edge(id,false);if(m==='bottom')edge(id,true);if(m==='up')mv(id,-1);if(m==='down')mv(id,1);if(m==='shape')toggle(id);if(m==='edit'){manageO.classList.remove('show');openEdit(id)}})}function renderThemes(){themeList.innerHTML=Object.entries(ts).map(([k,t])=>`<button class="theme ${theme===k?'on':''}" data-t="${k}" style="background:${t[0]};color:${t[3]}"><b>${t[6]}</b><span style="background:${t[2]};padding:9px;border-radius:9px">رَبِّ اشْرَحْ لِي صَدْرِي</span></button>`).join('');$$('[data-t]').forEach(b=>b.onclick=()=>{theme=b.dataset.t;applyTheme()})}function msg(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}add.onclick=()=>openEdit();manage.onclick=()=>{renderManage();manageO.classList.add('show')};themes.onclick=()=>{renderThemes();themeO.classList.add('show')};save.onclick=saveEdit;$$('#shape button').forEach(b=>b.onclick=()=>{shape=b.dataset.v;syncShape()});$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('show'));render();applyTheme();
</script></body></html>
